services:
  obsy:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    # Match the host Docker socket's group so the non-root runtime user can query it.
    # Override with DOCKER_GID when the host uses a different Docker group ID.
    group_add:
      - "${DOCKER_GID:-990}"
    environment:
      # Set OBSY_APPS_CONFIG instead when you prefer a single environment variable.
      OBSY_APPS_CONFIG_PATH: /etc/obsy/apps.json
      OBSY_PROC_PATH: /host/proc
      OBSY_DISK_PATH: /hostfs
      OBSY_HOSTNAME: production-vps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only access is enough for docker inspect and docker stats.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # These two mounts let host-level metrics remain host-level in the collector container.
      - /proc:/host/proc:ro
      - /:/hostfs:ro
      # The source file is resolved on the host and is not copied into the image.
      - ${OBSY_APPS_CONFIG_FILE:-./config/apps.json}:/etc/obsy/apps.json:ro